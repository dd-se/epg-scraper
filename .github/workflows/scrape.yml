# Daily EPG scrape — scrapes every provider on a schedule and publishes the
# resulting XMLTV guides to a rolling "latest" GitHub Release, so IPTV apps
# can fetch them from a stable URL:
#
#   https://github.com/dd-se/epg-scraper/releases/latest/download/epg_hurriyet_TR.xml.gz
#   https://github.com/dd-se/epg-scraper/releases/latest/download/epg_mynet_TR.xml.gz
#   https://github.com/dd-se/epg-scraper/releases/latest/download/epg_tvplus_TR.xml.gz
#   https://github.com/dd-se/epg-scraper/releases/latest/download/epg_beinsports_TR.xml.gz
#   https://github.com/dd-se/epg-scraper/releases/latest/download/epg_digiturkburada_TR.xml.gz
#   https://github.com/dd-se/epg-scraper/releases/latest/download/epg_sporekrani_TR.xml.gz
#   https://github.com/dd-se/epg-scraper/releases/latest/download/epg_tivibu_TR.xml.gz
#   https://github.com/dd-se/epg-scraper/releases/latest/download/epg_sports_merged_TR.xml.gz  (sports merge: tvplus + beinsports + digiturkburada + sporekrani + tivibu)
#
# (Replace OWNER/REPO with this repository's path. The repo must be public —
# release assets on private repos need authentication, which IPTV apps can't
# do. The URLs start working after the first successful run.)
#
# Outputs are gitignored (`epg_*.xml*`), so nothing is committed.
# Manual runs: Actions tab → "Daily EPG scrape" → "Run workflow".

name: Daily EPG scrape

on:
  schedule:
    # 00:30 UTC = 03:30 TRT, daily — after midnight when the source sites
    # roll over to the new day's schedules.
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Scrapes are sequential politeness-sensitive page fetches; never run two
# schedules concurrently against the sources.
concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: hurriyet
            args: ''
          - provider: mynet
            # Mynet fetches ~90 channel pages per day (~260 requests for the
            # full 3-day window). Keep an explicit polite per-request delay
            # so scheduled runs from datacenter IPs don't hammer the source.
            args: '--days-forward 2 --delay-ms 500'
          - provider: tvplus
            # Plain-HTTP JSON API: 16 channels, one POST per channel-day.
            # A 3-day window (like the merged guide) keeps the API load and
            # politeness reasonable from a datacenter IP.
            args: '--days-forward 2'
          - provider: beinsports
            # Publishes exactly one Mon–Sun week per channel, so the full
            # week is always scraped (28 fetches) regardless of the window.
            args: ''
          - provider: digiturkburada
            # 4 channels, one POST per channel-day; 3-day window matches the
            # merged sports guide.
            args: '--days-forward 2'
          - provider: sporekrani
            # One page per channel (9 pages total) — the provider's default
            # 500 ms delay is polite enough for a daily run.
            args: ''
          - provider: tivibu
            # One session GET + one POST per channel-day (4 channels) — the
            # provider's default 400 ms delay is polite enough.
            args: ''
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scrape ${{ matrix.provider }}
        run: node bin/epg-scraper.js --provider ${{ matrix.provider }} ${{ matrix.args }}

      - name: List output
        run: ls -la epg_*.xml*

      - name: Upload guide
        uses: actions/upload-artifact@v6
        with:
          name: epg-${{ matrix.provider }}
          path: epg_*.xml*
          retention-days: 7
          if-no-files-found: error

  # One combined sports guide: union of tvplus (16), beinsports (4),
  # digiturkburada (4), sporekrani (9) and tivibu (4) channels.  Reuses the
  # per-provider guides scraped above — zero live-server hits: the artifacts
  # are downloaded and merged offline with --merge --from.
  epg-sports-merged:
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download sports guides
        uses: actions/download-artifact@v6
        with:
          pattern: epg-*
          merge-multiple: true
          path: guides

      - name: List guides
        run: ls -la guides/

      - name: Merge sports providers (offline, no scraping)
        run: node bin/epg-scraper.js --merge --from guides/epg_tvplus_TR.xml.gz,guides/epg_beinsports_TR.xml.gz,guides/epg_digiturkburada_TR.xml.gz,guides/epg_sporekrani_TR.xml.gz,guides/epg_tivibu_TR.xml.gz --out epg_sports_merged_TR.xml.gz

      - name: List output
        run: ls -la epg_sports_merged_TR.xml*

      - name: Upload merged guide
        uses: actions/upload-artifact@v6
        with:
          name: epg-sports-merged
          path: epg_sports_merged_TR.xml*
          retention-days: 7
          if-no-files-found: error

  # Collect the per-provider guides and (re)publish them as assets on a
  # rolling "latest" release. Asset names are stable, so
  # .../releases/latest/download/<name> is a permanent raw URL for IPTV apps.
  # Runs only when every provider scraped cleanly; otherwise yesterday's
  # release stays live and the app keeps working.
  publish:
    needs: [scrape, epg-sports-merged]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download guides
        uses: actions/download-artifact@v6
        with:
          pattern: epg-*
          merge-multiple: true
          path: guide

      - name: List guides
        run: ls -la guide/

      - name: Stamp date
        run: echo "GUIDE_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Publish to "latest" release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          commit: main
          name: Latest EPG guides
          body: Daily XMLTV guides for Türkiye, scraped ${{ env.GUIDE_DATE }} (00:30 UTC). Point your IPTV app's XMLTV/EPG source at the .xml.gz files below.
          makeLatest: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: guide/epg_*.xml.gz
