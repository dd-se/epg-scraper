# Daily EPG scrape — scrapes every provider on a schedule and publishes the
# resulting XMLTV guides to a rolling "latest" GitHub Release, so IPTV apps
# can fetch them from a stable URL:
#
#   https://github.com/dd-se/epg-scraper/releases/latest/download/epg_hurriyet_TR.xml.gz
#   https://github.com/dd-se/epg-scraper/releases/latest/download/epg_mynet_TR.xml.gz
#   https://github.com/dd-se/epg-scraper/releases/latest/download/epg_tvplus_TR.xml.gz
#   https://github.com/dd-se/epg-scraper/releases/latest/download/epg_digiturkburada_TR.xml.gz
#   https://github.com/dd-se/epg-scraper/releases/latest/download/epg_sporekrani_TR.xml.gz
#   https://github.com/dd-se/epg-scraper/releases/latest/download/epg_tivibu_TR.xml.gz
#   https://github.com/dd-se/epg-scraper/releases/latest/download/epg_idmantv_TR.xml.gz
#   https://github.com/dd-se/epg-scraper/releases/latest/download/epg_tvnu_SE.xml.gz  (Swedish guide: lang="sv", +01:00/+02:00 Stockholm offsets)
#   https://github.com/dd-se/epg-scraper/releases/latest/download/epg_sports_merged_TR.xml.gz  (sports merge: tvplus + digiturkburada + sporekrani + tivibu + idmantv)
#
# (Replace OWNER/REPO with this repository's path. The repo must be public —
# release assets on private repos need authentication, which IPTV apps can't
# do. The URLs start working after the first successful run.)
#
# Outputs are gitignored (`epg_*.xml*`), so nothing is committed.
# Manual runs: Actions tab → "Daily EPG scrape" → "Run workflow".
#
# Resilience model (partial failures are expected — sources flap, datacenter
# IPs get throttled, a site rolls its week over early):
# - Each provider scrape is retried (3 attempts with backoff) and runs with
#   hardened transport flags (--retries/--timeout-ms/--retry-delay-ms).
# - One provider failing never blocks the others: the matrix uses
#   fail-fast: false, per-step `if: always()` keeps listings/uploads running,
#   and artifact upload uses `if-no-files-found: warn`.
# - The sports-merge and publish jobs run with `if: !cancelled()` so they
#   still run when some providers failed — they merge/publish whatever
#   guides exist. Yesterday's release assets stay live for providers that
#   failed today (replacesArtifacts only replaces uploaded files).

name: Daily EPG scrape

on:
  schedule:
    # 00:30 UTC = 03:30 TRT, daily — after midnight when the source sites
    # roll over to the new day's schedules.
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Scrapes are sequential politeness-sensitive page fetches; never run two
# schedules concurrently against the sources.
concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
      sports_inputs: ${{ steps.inventory.outputs.sports_inputs }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build provider inventory
        id: inventory
        run: node scripts/provider-inventory.js --github-output >> "$GITHUB_OUTPUT"

  scrape:
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Transient source flap is the norm (5xx/429/TCP reset from datacenter
      # IPs). The CLI already retries per request; this loop additionally
      # retries the whole provider run so one bad minute doesn't lose a
      # day's guide. The job still exits non-zero after 3 failed attempts
      # so the failure stays visible — downstream jobs run anyway.
      - name: Scrape ${{ matrix.provider }} (with retries)
        id: scrape
        run: |
          attempt=1
          max_attempts=3
          code=1
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Attempt $attempt/$max_attempts: provider ${{ matrix.provider }}"
            # Hardened transport: more per-request retries and a generous
            # hard timeout for slow datacenter links; linear backoff
            # between attempts. Provider-specific $ARGS (politeness delay,
            # day window) are preserved after the transport flags.
            # shellcheck disable=SC2086
            if node bin/epg-scraper.js --provider ${{ matrix.provider }} \
              --retries 4 --timeout-ms 30000 --retry-delay-ms 1000 \
              ${{ matrix.args }}; then
              code=0
              break
            fi
            code=$?
            echo "::warning::Scrape attempt $attempt/$max_attempts for ${{ matrix.provider }} failed (exit $code)"
            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep $((attempt * 20))
            fi
            attempt=$((attempt + 1))
          done
          if [ "$code" -ne 0 ]; then
            echo "::error::Provider ${{ matrix.provider }} failed after $max_attempts attempts — downstream jobs will use the remaining providers"
          fi
          exit "$code"

      - name: List output
        if: always()
        run: ls -la epg_*.xml* 2>/dev/null || echo "::warning::No guide files produced for ${{ matrix.provider }}"

      - name: Validate guide
        if: always()
        run: |
          shopt -s nullglob
          files=(epg_*.xml*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::warning::No guide to validate for ${{ matrix.provider }} — skipping"
            exit 0
          fi
          valid=0
          for f in "${files[@]}"; do
            size=$(stat -c%s "$f")
            echo "$f: ${size} bytes"
            if [ "$size" -lt 1024 ]; then
              echo "::warning::$f is suspiciously small (${size} bytes)"
              continue
            fi
            case "$f" in
              *.gz)
                if ! gzip -t "$f"; then
                  echo "::warning::$f failed gzip integrity check"
                  continue
                fi
                if ! gzip -dc "$f" | head -c 4096 | grep -q '<tv'; then
                  echo "::warning::$f has no <tv> root element"
                  continue
                fi
                ;;
              *)
                if ! head -c 4096 "$f" | grep -q '<tv'; then
                  echo "::warning::$f has no <tv> root element"
                  continue
                fi
                ;;
            esac
            valid=$((valid + 1))
          done
          if [ "$valid" -eq 0 ]; then
            echo "::warning::No valid guide for ${{ matrix.provider }} — artifact upload will be empty"
          fi
          echo "Validated $valid/${#files[@]} file(s) for ${{ matrix.provider }}"

      # `warn` (not `error`) so a single dead source doesn't fail the
      # upload step itself — the matrix job already records the failure.
      - name: Upload guide
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: epg-${{ matrix.provider }}
          path: epg_*.xml*
          retention-days: 7
          if-no-files-found: warn

  # One combined sports guide: union of tvplus (16), digiturkburada (8),
  # sporekrani (9), tivibu (4) and idmantv (1) channels.
  # Reuses the per-provider guides scraped above — zero live-server hits: the
  # artifacts are downloaded and merged offline with --merge --from.
  # Runs even when some providers failed (`!cancelled()`): merges whatever
  # sports guides are available and warns about the missing ones.
  epg-sports-merged:
    needs: [inventory, scrape]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download sports guides
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          pattern: epg-*
          merge-multiple: true
          path: guides

      - name: List guides
        if: always()
        run: ls -la guides/ 2>/dev/null || echo "::warning::No guide artifacts downloaded"

      # Merge whatever sports guides survived. A missing provider is a
      # warning, not a failure — yesterday's merged asset stays live for
      # the gap, and today's merge covers the rest.
      - name: Merge sports providers (offline, no scraping)
        id: merge
        env:
          SPORTS_INPUTS_JSON: ${{ needs.inventory.outputs.sports_inputs }}
        run: |
          shopt -s nullglob
          mapfile -t wanted < <(node -e 'for (const file of JSON.parse(process.env.SPORTS_INPUTS_JSON)) console.log(file)')
          inputs=()
          missing=()
          for f in "${wanted[@]}"; do
            if [ -f "$f" ]; then
              inputs+=("$f")
            else
              # Fall back to a plain-.xml artifact if a provider run wrote
              # uncompressed output (e.g. a manual re-run artifact).
              base="${f%.gz}"
              if [ -f "$base" ]; then
                inputs+=("$base")
              else
                missing+=("$(basename "$f")")
              fi
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::Missing sports guides (skipped): ${missing[*]}"
          fi
          echo "Available sports guides: ${inputs[*]:-<none>}"
          if [ "${#inputs[@]}" -eq 0 ]; then
            echo "::error::No sports guides available — nothing to merge"
            exit 1
          fi
          IFS=,; from_list="${inputs[*]}"; unset IFS
          echo "Merging: $from_list"
          node bin/epg-scraper.js --merge --from "$from_list" --out epg_sports_merged_TR.xml.gz

      - name: List output
        if: always()
        run: ls -la epg_sports_merged_TR.xml* 2>/dev/null || echo "::warning::No merged guide produced"

      - name: Upload merged guide
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: epg-sports-merged
          path: epg_sports_merged_TR.xml*
          retention-days: 7
          if-no-files-found: warn

  # Collect the per-provider guides and (re)publish them as assets on a
  # rolling "latest" release. Asset names are stable, so
  # .../releases/latest/download/<name> is a permanent raw URL for IPTV apps.
  # Runs even on partial failure: every valid guide found is published,
  # providers that failed today keep yesterday's assets (replacesArtifacts
  # only replaces the files actually uploaded).
  publish:
    needs: [scrape, epg-sports-merged]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download guides
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          pattern: epg-*
          merge-multiple: true
          path: guide

      - name: List guides
        if: always()
        run: ls -la guide/ 2>/dev/null || echo "::warning::No guide artifacts downloaded"

      # Drop corrupt/empty downloads before they can reach the release:
      # a bad asset must never overwrite yesterday's good one.
      - name: Validate guides
        id: validate
        run: |
          shopt -s nullglob
          files=(guide/epg_*.xml*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No guide artifacts to publish"
            exit 1
          fi
          valid=0
          for f in "${files[@]}"; do
            size=$(stat -c%s "$f")
            ok=1
            if [ "$size" -lt 1024 ]; then
              echo "::warning::$f too small (${size} bytes) — removing from publish set"
              rm -f "$f"
              ok=0
            elif [[ "$f" == *.gz ]]; then
              if ! gzip -t "$f"; then
                echo "::warning::$f failed gzip check — removing from publish set"
                rm -f "$f"
                ok=0
              elif ! gzip -dc "$f" | head -c 4096 | grep -q '<tv'; then
                echo "::warning::$f has no <tv> root — removing from publish set"
                rm -f "$f"
                ok=0
              fi
            elif ! head -c 4096 "$f" | grep -q '<tv'; then
              echo "::warning::$f has no <tv> root — removing from publish set"
              rm -f "$f"
              ok=0
            fi
            [ "$ok" -eq 1 ] && valid=$((valid + 1))
          done
          echo "valid=$valid" >> "$GITHUB_OUTPUT"
          echo "Valid guides: $valid/${#files[@]}"
          ls -la guide/ || true
          if [ "$valid" -eq 0 ]; then
            echo "::error::All downloaded guides failed validation — refusing to touch the release (previous assets stay live)"
            exit 1
          fi

      - name: Stamp date
        run: echo "GUIDE_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      # Release notes list which provider scraped which channels, generated
      # from the downloaded guides themselves (scripts/build-release-notes.js)
      # so the notes stay accurate when lineups change. Degrades to a stub
      # when no guides are readable — never fails the publish.
      - name: Build release notes
        run: |
          if BODY=$(node scripts/build-release-notes.js --guides guide --date "$GUIDE_DATE"); then
            {
              echo 'RELEASE_BODY<<EOF'
              echo "$BODY"
              echo 'EOF'
            } >> "$GITHUB_ENV"
          else
            echo "::warning::build-release-notes failed — using fallback body"
            {
              echo 'RELEASE_BODY<<EOF'
              echo "Daily XMLTV guides for Türkiye, scraped $GUIDE_DATE (00:30 UTC)."
              echo 'EOF'
            } >> "$GITHUB_ENV"
          fi

      - name: Publish to "latest" release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          commit: main
          name: Latest EPG guides
          body: ${{ env.RELEASE_BODY }}
          makeLatest: true
          allowUpdates: true
          replacesArtifacts: true
          omitBodyDuringUpdate: false
          omitNameDuringUpdate: true
          artifacts: guide/epg_*.xml.gz
